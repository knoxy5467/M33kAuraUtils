name: M33kAuraUtils Release & CurseForge Publishing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate-and-publish:
    name: Validate Tests & Publish M33kAuraUtils
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Lua 5.4
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Run Build & Test Suite
        run: |
          lua build.lua

      - name: Package and Release (CurseForge, Wago, GitHub)
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
